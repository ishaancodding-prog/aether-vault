<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.6);
      --success: #10b981;
      --danger: #ef4444;
      --radius-lg: 24px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
      animation: float 10s infinite alternate ease-in-out;
    }
    .orb-1 { width: 400px; height: 400px; background: #6366f1; top: -100px; left: -100px; }
    .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: -50px; right: -50px; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 40px) scale(1.1); }
    }

    /* View Controller */
    .view {
      display: none;
      width: 100%;
      max-width: 1100px;
      margin: 20px;
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .view.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Glass Container */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Auth Page Specifics */
    .auth-container {
      max-width: 440px;
      margin: 0 auto;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 15px;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Dashboard Layout */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 30px;
    }

    .profile-badge {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Grid & Widgets */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .widget-box {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 380px;
    }

    .widget-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 6px;
      margin-bottom: 16px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      animation: messagePop 0.2s ease-out;
    }

    @keyframes messagePop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent-gradient);
      color: #fff;
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
    }

    /* Task List */
    .task-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-item button {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- AUTHENTICATION VIEW -->
  <div id="authView" class="view active">
    <div class="glass-card auth-container">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your local workspace</p>
      </div>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Full Name or Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. Ishaan Thusoo" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">
          Sign In
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD VIEW -->
  <div id="dashboardView" class="view">
    <div class="glass-card">
      <div class="dashboard-header">
        <div class="profile-badge">
          <div class="avatar" id="avatarIcon">U</div>
          <div>
            <h2 id="userNameDisplay" style="font-size: 18px; font-weight: 700;">Workspace User</h2>
            <span style="font-size: 13px; color: var(--success); display: flex; align-items: center; gap: 5px;">
              ● Local Engine Active
            </span>
          </div>
        </div>
        <button onclick="handleLogout()" class="btn-secondary">Log Out</button>
      </div>

      <div class="dashboard-grid">
        <!-- Interactive Local Bot (No API) -->
        <div class="widget-box">
          <div class="widget-title">
            <span>Offline Intelligent Agent</span>
            <span style="font-size: 11px; color: var(--text-muted);">Self-Contained</span>
          </div>
          <div class="chat-history" id="chatHistory">
            <div class="msg bot">Hello! I am your local offline assistant. Ask me anything or run quick math computations.</div>
          </div>
          <div class="input-wrapper">
            <input type="text" id="chatInput" class="form-control" placeholder="Type a message or calculation..." onkeydown="if(event.key === 'Enter') sendLocalMessage()" />
            <button class="btn-primary" style="width: auto; padding: 0 18px;" onclick="sendLocalMessage()">Send</button>
          </div>
        </div>

        <!-- Local Task Board -->
        <div class="widget-box">
          <div class="widget-title">
            <span>Project Tasks</span>
            <span id="taskCount" style="font-size: 12px; color: var(--accent-primary); font-weight: 600;">0 Tasks</span>
          </div>
          <ul class="task-list" id="taskList"></ul>
          <div class="input-wrapper">
            <input type="text" id="taskInput" class="form-control" placeholder="New task..." onkeydown="if(event.key === 'Enter') addTask()" />
            <button class="btn-primary" style="width: auto; padding: 0 18px;" onclick="addTask()">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Navigation / Page Transition Handler
    function showPage(pageId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      setTimeout(() => {
        const target = document.getElementById(pageId);
        if (target) {
          target.classList.add('active');
        }
      }, 50);
    }

    // Authentication Logic (Purely Client-Side, No APIs)
    function handleAuth(event) {
      event.preventDefault();
      const userField = document.getElementById('username').value.trim();
      if (!userField) return;

      localStorage.setItem('local_app_user', userField);
      loadDashboard(userField);
      showPage('dashboardView');
    }

    function handleLogout() {
      localStorage.removeItem('local_app_user');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      showPage('authView');
    }

    function loadDashboard(name) {
      document.getElementById('userNameDisplay').innerText = name;
      document.getElementById('avatarIcon').innerText = name.charAt(0).toUpperCase();
      renderTasks();
    }

    // Local Logic Bot (Rule-based & arithmetic engine, zero API calls)
    function sendLocalMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const history = document.getElementById('chatHistory');
      
      // Render user message
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.innerText = text;
      history.appendChild(userMsg);
      input.value = '';

      // Generate local response
      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'msg bot';
        botMsg.innerText = generateLocalResponse(text);
        history.appendChild(botMsg);
        history.scrollTop = history.scrollHeight;
      }, 300);

      history.scrollTop = history.scrollHeight;
    }

    function generateLocalResponse(query) {
      const lower = query.toLowerCase();

      // Math Evaluator
      try {
        if (/^[0-9+\-*/().\s^%]+$/.test(query) && query.length > 1) {
          return `Result: ${Function('"use strict"; return (' + query + ')')()}`;
        }
      } catch (e) {}

      if (lower.includes('hello') || lower.includes('hi')) return "Greetings! How can I assist you with your local tasks today?";
      if (lower.includes('time')) return `Current local time is: ${new Date().toLocaleTimeString()}`;
      if (lower.includes('date')) return `Today's date is: ${new Date().toLocaleDateString()}`;
      if (lower.includes('clear')) {
        document.getElementById('chatHistory').innerHTML = '';
        return "Chat cleared.";
      }
      return `Processed offline: "${query}". (Running locally with zero external network calls).`;
    }

    // Task Management Logic (Local Storage)
    function getTasks() {
      return JSON.parse(localStorage.getItem('local_tasks') || '[]');
    }

    function saveTasks(tasks) {
      localStorage.setItem('local_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      const tasks = getTasks();
      tasks.push({ id: Date.now(), text: text, completed: false });
      saveTasks(tasks);
      input.value = '';
    }

    function toggleTask(id) {
      const tasks = getTasks().map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks(tasks);
    }

    function deleteTask(id) {
      const tasks = getTasks().filter(t => t.id !== id);
      saveTasks(tasks);
    }

    function renderTasks() {
      const tasks = getTasks();
      const list = document.getElementById('taskList');
      const count = document.getElementById('taskCount');
      list.innerHTML = '';
      count.innerText = `${tasks.length} Tasks`;

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <span style="cursor: pointer;" onclick="toggleTask(${task.id})">
            ${task.completed ? '✓ ' : '○ '} ${task.text}
          </span>
          <button onclick="deleteTask(${task.id})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    // Auto-login persistence check
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('local_app_user');
      if (savedUser) {
        loadDashboard(savedUser);
        showPage('dashboardView');
      }
    });
  </script>
</body>
</html>
