<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split-Flap Departure Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161b26;
      --board-border: #232936;
      --tile-bg: #1c2230;
      --tile-text: #f3f4f6;
      --tile-border: #0a0d14;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--tile-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 900px;
      width: 100%;
    }

    /* Mechanical Board Frame */
    .board-frame {
      background: var(--card-bg);
      border: 3px solid var(--board-border);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 0, 0, 0.5);
      width: 100%;
      overflow-x: auto;
    }

    .board-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: max-content;
      margin: 0 auto;
    }

    .board-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    /* Individual Split Flap Tile */
    .flap-tile {
      position: relative;
      width: 32px;
      height: 48px;
      background: var(--tile-bg);
      border-radius: 4px;
      font-size: 28px;
      font-weight: bold;
      line-height: 48px;
      text-align: center;
      color: var(--tile-text);
      perspective: 300px;
      user-select: none;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
    }

    /* Center Split Line */
    .flap-tile::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--tile-border);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
      z-index: 5;
    }

    /* 3D Flip Animation */
    .flap-tile.flipping {
      animation: flip-flap 0.12s linear;
    }

    @keyframes flip-flap {
      0% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
      50% {
        transform: rotateX(-90deg);
        filter: brightness(0.6);
      }
      100% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
    }

    /* Controls Panel */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    button {
      background: var(--card-bg);
      color: var(--tile-text);
      border: 1px solid var(--board-border);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Custom Message Input Bar */
    .input-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 600px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--board-border);
      padding: 10px 16px;
      border-radius: 6px;
      color: #fff;
      outline: none;
      font-size: 14px;
      letter-spacing: 1px;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="board-frame">
      <div id="board" class="board-grid"></div>
    </div>

    <!-- Interactive Controls Panel -->
    <div class="controls">
      <button id="prevBtn">◄ PREV</button>
      <button id="toggleBtn">❚❚ PAUSE</button>
      <button id="nextBtn">NEXT ►</button>
      <button id="audioToggle">🔊 SOUND: ON</button>
    </div>

    <!-- Custom Broadcast Message Input -->
    <div class="input-bar">
      <input type="text" id="customInput" placeholder="Type custom message & press Enter..." maxlength="44" />
      <button id="sendBtn">SET TEXT</button>
    </div>
  </div>

  <script>
    const MESSAGES = [
      "STAY HUNGRY \nSTAY IN BED \n- STEVE JOBS",
      "What did you get done this week?",
      "I burned $20 \nfor this shit.",
      "DONT WORRY \nBE HAPPY FFS.",
      "LADIES AND GENTLEMEN \nWELCOME TO F#!@# C!@$"
    ];

    const ROWS = 3;
    const COLS = 22;
    const CHAR_SET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,!?:;/@#$%^&*()-_+=$";

    let currentMessageIndex = 0;
    let isAutoPlaying = true;
    let intervalTimer = null;
    let isAudioEnabled = true;
    let currentMatrix = Array.from({ length: ROWS }, () => Array(COLS).fill(" "));

    const boardElement = document.getElementById("board");
    const toggleBtn = document.getElementById("toggleBtn");
    const audioToggle = document.getElementById("audioToggle");
    const customInput = document.getElementById("customInput");

    // Synthesized Mechanical Click Audio using Web Audio API
    let audioCtx = null;
    function playFlapSound() {
      if (!isAudioEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = "triangle";
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // Build the grid of tiles
    function initializeBoard() {
      boardElement.innerHTML = "";
      for (let r = 0; r < ROWS; r++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "board-row";
        for (let c = 0; c < COLS; c++) {
          const tile = document.createElement("div");
          tile.className = "flap-tile";
          tile.id = `tile-${r}-${c}`;
          tile.textContent = " ";
          rowDiv.appendChild(tile);
        }
        boardElement.appendChild(rowDiv);
      }
    }

    // Format any text string to match the ROWS x COLS grid
    function formatMessageToMatrix(text) {
      const lines = text.toUpperCase().split("\n");
      const matrix = [];

      for (let r = 0; r < ROWS; r++) {
        const line = lines[r] || "";
        const rowChars = line.padEnd(COLS, " ").slice(0, COLS).split("");
        matrix.push(rowChars);
      }
      return matrix;
    }

    // Flips a single tile progressively through the character set
    function animateTile(r, c, targetChar) {
      const tile = document.getElementById(`tile-${r}-${c}`);
      let currentChar = currentMatrix[r][c];

      if (currentChar === targetChar) return;

      let currentIndex = CHAR_SET.indexOf(currentChar);
      if (currentIndex === -1) currentIndex = 0;

      const targetIndex = CHAR_SET.indexOf(targetChar) === -1 ? 0 : CHAR_SET.indexOf(targetChar);

      function step() {
        currentIndex = (currentIndex + 1) % CHAR_SET.length;
        const nextChar = CHAR_SET[currentIndex];

        tile.textContent = nextChar;
        tile.classList.remove("flipping");
        void tile.offsetWidth; // Reflow for animation
        tile.classList.add("flipping");

        if (Math.random() > 0.6) playFlapSound();

        if (nextChar !== targetChar) {
          setTimeout(step, 40 + Math.random() * 20);
        } else {
          currentMatrix[r][c] = targetChar;
          tile.classList.remove("flipping");
        }
      }

      step();
    }

    // Update entire board to target message
    function setMessage(text) {
      const targetMatrix = formatMessageToMatrix(text);
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const delay = (r * COLS + c) * 15; // Stagger effect
          setTimeout(() => {
            animateTile(r, c, targetMatrix[r][c]);
          }, delay);
        }
      }
    }

    function showNextMessage() {
      currentMessageIndex = (currentMessageIndex + 1) % MESSAGES.length;
      setMessage(MESSAGES[currentMessageIndex]);
    }

    function showPrevMessage() {
      currentMessageIndex = (currentMessageIndex - 1 + MESSAGES.length) % MESSAGES.length;
      setMessage(MESSAGES[currentMessageIndex]);
    }

    function startAutoPlay() {
      clearInterval(intervalTimer);
      intervalTimer = setInterval(showNextMessage, 6000);
      toggleBtn.textContent = "❚❚ PAUSE";
      isAutoPlaying = true;
    }

    function stopAutoPlay() {
      clearInterval(intervalTimer);
      toggleBtn.textContent = "► PLAY";
      isAutoPlaying = false;
    }

    // Event Listeners
    toggleBtn.addEventListener("click", () => {
      if (isAutoPlaying) stopAutoPlay();
      else startAutoPlay();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      showNextMessage();
      if (isAutoPlaying) startAutoPlay();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      showPrevMessage();
      if (isAutoPlaying) startAutoPlay();
    });

    audioToggle.addEventListener("click", () => {
      isAudioEnabled = !isAudioEnabled;
      audioToggle.textContent = isAudioEnabled ? "🔊 SOUND: ON" : "🔇 SOUND: OFF";
    });

    function applyCustomText() {
      const val = customInput.value.trim();
      if (val) {
        stopAutoPlay();
        setMessage(val);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", applyCustomText);
    customInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") applyCustomText();
    });

    // Initialize board on load
    initializeBoard();
    setMessage(MESSAGES[0]);
    startAutoPlay();
  </script>
</body>
</html>
