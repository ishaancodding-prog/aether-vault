<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Journal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #faf8f5;
    color: #2b2620;
  }
  .loading, .signin-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    padding: 24px;
  }
  button {
    background: #7c5cff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
  }
  button:hover { background: #6a4ce0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .journal {
    max-width: 640px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .journal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid #e8e2d8;
  }
  .muted { color: #8a8072; font-size: 14px; }
  .signout-btn {
    background: none;
    border: 1px solid #d8d0c2;
    color: #2b2620;
    border-radius: 6px;
    padding: 6px 12px;
  }
  .signout-btn:hover { background: #f0ebe1; }

  .entries {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: #7c5cff;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.model {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e8e2d8;
    border-bottom-left-radius: 4px;
  }
  .bubble.typing { opacity: 0.5; }

  .error { color: #b3261e; padding: 0 16px; font-size: 14px; }

  .composer {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid #e8e2d8;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid #d8d0c2;
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
    font-family: inherit;
  }
  #app { display: none; }
</style>
</head>
<body>

<div id="loading" class="loading">Loading…</div>

<div id="signin" class="signin-screen" style="display:none">
  <h1>Your Private Gemini Journal</h1>
  <p>Sign in to start journaling. Your entries are visible only to you.</p>
  <button id="signin-btn">Sign in with Google</button>
</div>

<div id="app" class="journal">
  <header class="journal-header">
    <div>
      <strong id="user-name"></strong>
      <span class="muted" id="user-email"></span>
    </div>
    <button class="signout-btn" id="signout-btn">Sign out</button>
  </header>

  <div class="entries" id="entries">
    <p class="muted" id="empty-msg">Nothing here yet. Write whatever's on your mind.</p>
  </div>

  <div class="error" id="error" style="display:none"></div>

  <form class="composer" id="composer">
    <textarea id="draft" rows="2" placeholder="What's on your mind today?"></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script type="module">
  // ---------------------------------------------------------------------
  // Firebase client config. NOT a secret — safe to ship in this HTML file.
  // Real access control is Firestore Rules + the Cloud Function's auth
  // check (see functions/index.js), not hiding these values.
  // Fill these in from Firebase Console > Project Settings > General.
  // ---------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID",
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import {
    getFunctions, httpsCallable,
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-functions.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const functions = getFunctions(app);
  const googleProvider = new GoogleAuthProvider();
  const chatWithGemini = httpsCallable(functions, "chatWithGemini");

  // -- DOM refs ----------------------------------------------------------
  const $loading = document.getElementById("loading");
  const $signin = document.getElementById("signin");
  const $app = document.getElementById("app");
  const $signinBtn = document.getElementById("signin-btn");
  const $signoutBtn = document.getElementById("signout-btn");
  const $userName = document.getElementById("user-name");
  const $userEmail = document.getElementById("user-email");
  const $entries = document.getElementById("entries");
  const $emptyMsg = document.getElementById("empty-msg");
  const $composer = document.getElementById("composer");
  const $draft = document.getElementById("draft");
  const $sendBtn = document.getElementById("send-btn");
  const $error = document.getElementById("error");

  let currentEntries = [];
  let unsubscribeEntries = null;
  let sending = false;

  // -- Auth ----------------------------------------------------------------
  $signinBtn.addEventListener("click", () => {
    signInWithPopup(auth, googleProvider).catch((err) =>
      console.error("Sign-in failed:", err)
    );
  });
  $signoutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    $loading.style.display = "none";
    if (unsubscribeEntries) { unsubscribeEntries(); unsubscribeEntries = null; }

    if (user) {
      $signin.style.display = "none";
      $app.style.display = "flex";
      $userName.textContent = user.displayName || "";
      $userEmail.textContent = user.email ? " — " + user.email : "";
      subscribeToEntries(user.uid);
    } else {
      $app.style.display = "none";
      $signin.style.display = "flex";
      currentEntries = [];
      renderEntries();
    }
  });

  // -- Isolated storage: scoped to /users/{uid}/entries only --------------
  function entriesRef(uid) {
    return collection(db, "users", uid, "entries");
  }

  function subscribeToEntries(uid) {
    const q = query(entriesRef(uid), orderBy("createdAt", "asc"));
    unsubscribeEntries = onSnapshot(q, (snap) => {
      currentEntries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderEntries();
    });
  }

  async function saveEntry(uid, role, text) {
    await addDoc(entriesRef(uid), { role, text, createdAt: serverTimestamp() });
  }

  function renderEntries() {
    $entries.innerHTML = "";
    if (currentEntries.length === 0 && !sending) {
      $entries.appendChild($emptyMsg);
      return;
    }
    for (const entry of currentEntries) {
      const div = document.createElement("div");
      div.className = "bubble " + entry.role;
      div.textContent = entry.text;
      $entries.appendChild(div);
    }
    if (sending) {
      const div = document.createElement("div");
      div.className = "bubble model typing";
      div.textContent = "…";
      $entries.appendChild(div);
    }
    $entries.scrollTop = $entries.scrollHeight;
  }

  // -- Sending a message: save turn, call the Cloud Function, save reply --
  $composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    const message = $draft.value.trim();
    if (!message || sending || !user) return;

    $draft.value = "";
    sending = true;
    $sendBtn.disabled = true;
    $error.style.display = "none";
    renderEntries();

    const history = currentEntries.map((e) => ({ role: e.role, text: e.text }));

    try {
      await saveEntry(user.uid, "user", message);
      const { data } = await chatWithGemini({ message, history });
      await saveEntry(user.uid, "model", data.reply);
    } catch (err) {
      console.error(err);
      $error.textContent = "Something went wrong sending that. Try again.";
      $error.style.display = "block";
    } finally {
      sending = false;
      $sendBtn.disabled = false;
      renderEntries();
    }
  });

  $draft.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $composer.requestSubmit();
    }
  });
</script>
</body>
</html>
